name: CI (lint + type + test)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    name: ruff lint + format + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install ruff mypy pytest
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format --check
        run: ruff format --check src/ tests/
      - name: mypy
        run: mypy src/ghlink/ --ignore-missing-imports

  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  release-workflow-check:
    name: 合并门禁 · 发布 workflow 存在性检查（P-006 v1.22）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验发布 workflow 存在且触发条件正确
        run: |
          set -e
          # 1) 发布 workflow 文件必须存在（P-007：tag 触发构建发包，PyPI 发布集成于 build.yml OIDC）
          [ -f .github/workflows/build.yml ] || { echo "❌缺少发布 workflow: .github/workflows/build.yml"; exit 1; }
          echo "✅ 存在: .github/workflows/build.yml"
          # 2) 触发条件校验：build.yml 必须由 tag push 触发
          grep -q "tags:" .github/workflows/build.yml || { echo "❌ build.yml 缺少 tag 触发条件"; exit 1; }
          # 3) PyPI 发布 job 必须集成于 build.yml（OIDC trusted publishing）
          grep -q "pypi-publish" .github/workflows/build.yml || { echo "❌ build.yml 缺少 PyPI 发布 job"; exit 1; }
          grep -q "gh-action-pypi-publish" .github/workflows/build.yml || { echo "❌ build.yml 缺少 PyPI 发布 action"; exit 1; }
          echo "✅ 合并门禁通过：build.yml 存在且可触发（push tag → build + PyPI OIDC 发布）"
