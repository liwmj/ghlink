name: W3 Windows install verify (temp)

on:
  push:
    branches: [w3-verify]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  w3-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download dist-windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          run-id: 31781196682
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run W3 three-path install verification
        shell: pwsh
        run: ./tests/windows_install_verify.ps1

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run macOS smoke (self-heal chain, root via passwordless sudo)
        run: |
          export REPO="$GITHUB_WORKSPACE"
          sudo bash scripts/macos_smoke.sh
