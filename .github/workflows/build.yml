name: Build ghlink (v0.2.0)

on:
  push:
    tags: ["v0.2.*"]
  workflow_dispatch:

jobs:
  build-sdist:
    name: PyPI sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/

  build-windows:
    name: Windows exe (PyInstaller + Inno)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          pip install pyinstaller
          pyinstaller packaging/windows/ghlink.spec --distpath dist/windows --workpath build/windows
      - name: Build Inno installer (installer.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          iscc packaging/windows/ghlink.iss
      - name: Rename installer asset
        shell: pwsh
        run: |
          Get-ChildItem dist/windows/ghlink-setup-*.exe | Rename-Item -NewName "ghlink-installer-$env:GITHUB_REF_NAME.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/windows/

  build-linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deb
        run: |
          pip install wheel build
          python -m build --wheel
          bash packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  build-macos:
    name: macOS brew formula (validate)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate formula
        run: |
          python3 -m py_compile src/ghlink/*.py
          ruby -c packaging/brew/ghlink.rb
      - name: Smoke test
        run: |
          pip install .
          ghlink --version
          ghlink status

  release:
    name: Attach to GitHub Release
    needs: [build-sdist, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建/更新 Release + 附件需要写权限
    if: startsWith(github.ref, 'refs/tags/v0.2')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.deb
          generate_release_notes: true
