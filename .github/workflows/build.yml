name: Build ghlink

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tag-format-check:
    name: tag 格式校验（SemVer 3 位，P-002 三.5.2）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 校验 tag 必须为 vX.Y.Z（禁止 4 位版本号）
        run: |
          TAG="${{ github.ref_name }}"
          echo "校验 tag: $TAG"
          # v0.3.0 李工 2026-08-22 定：严禁 x.x.x.x 4 位版本号，只允许 vX.Y.Z
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ tag 格式非法（必须 vX.Y.Z 三位）：$TAG"
            exit 1
          fi
          echo "✅ tag 格式合法: $TAG"

  build-sdist:
    name: PyPI sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/

  pypi-publish:
    name: PyPI 发布（OIDC trusted publishing）
    runs-on: ubuntu-latest
    needs: [build-sdist]
    permissions:
      id-token: write
    environment:
      name: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist/
      - name: Publish to PyPI
        # v0.5.12（李工 15:29 批）：线上已有完全相同的包（同文件名同 hash）时
        # skip-existing 跳过不报错——比 continue-on-error 精准：仅容忍「文件已存在」，
        # 其他错误（网络/凭证/真冲突）仍正常失败红。
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  build-windows:
    name: Windows exe (PyInstaller + Inno)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          pip install pyinstaller pystray Pillow
          pyinstaller packaging/windows/ghlink.spec --distpath dist/windows --workpath build/windows
      - name: Build Inno installer (installer.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          # v0.5.12（李工 08-27 定）：版本号注入 pyproject.toml 真值，根治 iss 硬编码 0.4.22
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $ver) { Write-Error "pyproject.toml version 解析失败"; exit 1 }
          iscc "/DMyAppVersion=$ver" packaging/windows/ghlink.iss
      - name: Rename installer asset
        shell: pwsh
        run: |
          Get-ChildItem dist/windows/ghlink-setup-*.exe | Rename-Item -NewName "ghlink-installer-$env:GITHUB_REF_NAME.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/windows/

  build-linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deb
        run: |
          pip install wheel build
          python -m build --wheel
          bash packaging/build_deb.sh
      - name: Generate apt repo metadata (Packages.gz + Release)
        run: |
          set -e
          # 方案①（李工 17:23 拍板，17:27 确认主流）：Release 托管 apt 源，trusted=yes 免签名
          # 赛博 17:36 实测修复：GitHub Release 资产在根目录，Packages 的 Filename 必须去掉 pool/main/ 前缀，
          # 否则 apt install 按 Filename 拼 URL → 404（v0.2.2 的坑，v0.2.3 修）
          mkdir -p apt-repo/pool/main
          cp dist/*.deb apt-repo/pool/main/
          cd apt-repo
          apt-ftparchive packages pool/ | sed 's|^Filename: pool/main/|Filename: |' > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release
          # 校验：Filename 无 pool/main 前缀
          grep '^Filename:' Packages
          ls -la . pool/main/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: apt-repo/

  build-macos:
    name: macOS brew formula (validate)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate formula
        run: |
          python3 -m py_compile src/ghlink/*.py
          ruby -c packaging/brew/ghlink.rb
      # v0.4.7（李工反馈 brew 停在 0.2.18）：发版时自动同步 formula 到 tap 仓库，
      # 杜绝「Release 发了 brew 没跟进」的通道缺口（此前仅校验不推送）
      - name: Sync formula to tap (homebrew-tap)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          TAP_REPO="liwmj/homebrew-tap"
          TAG="${GITHUB_REF#refs/tags/}"
          git clone "https://x-access-token:${GH_PAT}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          cp packaging/brew/ghlink.rb "$RUNNER_TEMP/tap/Formula/ghlink.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "ghlink-bot"
          git config user.email "ghlink@users.noreply.github.com"
          git add Formula/ghlink.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync formula to ${TAG}"
            git push origin HEAD:master
          else
            echo "formula 无变化，跳过"
          fi
      - name: Smoke test
        run: |
          pip install .
          ghlink --version
          ghlink status

  build-macos-pkg:
    name: macOS dmg (PyInstaller 双包, v0.5.12)
    strategy:
      matrix:
        include:
          # v0.5.12 临时（李工 19:50 批准「速度先打 arm」）：macos-13 runner 全局排队不可控（17:58 起 >2h），
          # 暂停 x86_64 让 ARM 托盘先验证；x86_64 等 runner 空出或顾笙 Intel 本机补打后再恢复。
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    needs: [build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    # v0.5.12（拂晓 16:53 根因）：Sync Cask 曾在矩阵 job 内各自 push，
    # x86_64/arm64 实例互写空值覆盖 tap（intel 空值 bug）。改：每个实例
    # 只输出自己架构的 sha256 到 job outputs，独立 sync-cask job 一次写双真值。
    outputs:
      sha_x86: ${{ steps.sha.outputs.x86 }}
      sha_arm: ${{ steps.sha.outputs.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build dmg (PyInstaller 双包, v0.5.12)
        id: sha
        run: |
          # 李工 11:20 拍板：分双包（Pillow 无 universal2 wheel，双 runner 矩阵最稳）
          # macos-13 = x86_64 runner，macos-14 = arm64 runner，各出对应架构 dmg
          pip install --only-binary :all: ds-store==1.3.3
          # v0.5.12（李工 18:14 真机实锤「修复版仍无托盘」根因）：pyobjc 必须装成功
          # 且被 PyInstaller 收集进包——之前 --quiet 吞了安装失败，PyInstaller 缺
          # PyObjC 只警告不失败 → 产物无 PyObjC → HAS_NATIVE=False → 回退 pystray
          # → ARM 原生不渲染 → 无托盘。去掉 --quiet + 安装后验证 + set -e 兜底。
          pip install pyinstaller pystray Pillow==11.3.0 pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz
          python3 -c "import objc, AppKit, Foundation, Quartz; print('PyObjC OK')"
          python3 -m PyInstaller packaging/macos/ghlink.spec --distpath dist/macos-pyi --workpath build/macos-pyi --clean --noconfirm
          USE_PYINSTALLER=1 VERSION=0.5.12-${{ matrix.arch }} bash packaging/macos/build_dmg.sh
          # 输出 dmg sha256 到 job outputs（v0.5.12 双包：各实例只算自己的架构）
          echo "arm=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x86=$(shasum -a 256 "$X86_DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-dmg
          path: dist/macos/

  # v0.5.12（拂晓 16:53 根因）：Sync Cask 从矩阵 job 抽出——矩阵实例各自 push
  # 会互相覆盖（x86_64 实例写 intel 真值+arm 空、arm64 实例写 arm 真值+intel 空，
  # 谁后跑完谁覆盖 → tap 必坏）。独立 job needs 矩阵 outputs 一次写双真值。
  sync-cask:
    name: Sync Cask to tap (homebrew-tap)
    runs-on: ubuntu-latest
    needs: [build-macos-pkg]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Sync Cask (双 sha256 一次写)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SHA_ARM: ${{ needs.build-macos-pkg.outputs.sha_arm }}
          SHA_X86: ${{ needs.build-macos-pkg.outputs.sha_x86 }}
        run: |
          set -e
          TAP_REPO="liwmj/homebrew-tap"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$SHA_ARM" ] || [ -z "$SHA_X86" ]; then
            echo "!! 双 sha256 未齐（arm=$SHA_ARM, x86=$SHA_X86），跳过 sync 防覆盖"
            exit 0
          fi
          git clone "https://x-access-token:${GH_PAT}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          # 双包真值分别写 arm/intel + version 随 tag 动态化（Linux sed 语法）
          sed -i "s/sha256 arm:.*/sha256 arm:   \"${SHA_ARM}\",/" packaging/macos/Casks/ghlink.rb
          sed -i "s/       intel:.*/       intel: \"${SHA_X86}\"/" packaging/macos/Casks/ghlink.rb
          sed -i "s/version \"[0-9.]*\"/version \"${TAG#v}\"/" packaging/macos/Casks/ghlink.rb
          cp packaging/macos/Casks/ghlink.rb "$RUNNER_TEMP/tap/Casks/ghlink.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "ghlink-bot"
          git config user.email "ghlink@users.noreply.github.com"
          git add Casks/ghlink.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync cask to ${TAG}"
            git push origin HEAD:master
          else
            echo "cask 无变化，跳过"
          fi

  macos-smoke:
    name: macOS real-machine smoke (hosts switch/rollback)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real-machine smoke
        run: |
          export REPO="$GITHUB_WORKSPACE"
          sudo bash scripts/macos_smoke.sh
        env:
          REPO: ${{ github.workspace }}

  release:
    name: Attach to GitHub Release
    needs: [build-sdist, build-windows, build-linux, build-macos-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建/更新 Release + 附件需要写权限
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2.2.1
        with:
          # v0.5.2（五刀⑤）：files 去重——v0.5.0/v0.5.1 曾因 glob 重复匹配 + release 刚创建
          # 不可发现导致 asset 元数据更新 404（Not Found）卡 draft。升级 v2.2.1（修复竞态）+ 精确匹配。
          files: |
            artifacts/dist-python/*.whl
            artifacts/dist-python/*.tar.gz
            artifacts/dist-windows/*.exe
            artifacts/dist-macos-dmg/*.dmg
            artifacts/dist-macos/*.pkg
            artifacts/dist-linux/*.deb
            artifacts/apt-repo/Packages.gz
            artifacts/apt-repo/Release
          fail_on_unmatched_files: false
          generate_release_notes: true

  deploy-pages:
    name: Deploy apt repo to GitHub Pages
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      pages: write  # 部署 GitHub Pages 需要
      id-token: write  # deploy-pages 需要 OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apt-repo
          path: apt-repo
      # Pages 站点根 = https://liwmj.github.io/ghlink/，apt 仓库放 apt/ 子目录
      # → 固定 URL https://liwmj.github.io/ghlink/apt/（李工 23:39 已建 Pages，源选 Actions）
      # 赛博 00:16 核对点①：Packages 的 Filename 已去 pool/main 前缀，
      # deb 必须提升到 apt 根目录，否则 apt 按 Filename 拼 URL → 404
      - name: Prepare pages content (apt/)
        run: |
          mkdir -p _site/apt
          cp apt-repo/pool/main/*.deb _site/apt/
          cp apt-repo/Packages.gz apt-repo/Release _site/apt/
          ls -la _site/apt/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
