name: Win enable debug (v0.4.2 ⑧)

on:
  push:
    branches: [fix/v0.4.2-eight]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  enable-debug:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe (PyInstaller)
        run: |
          pip install pyinstaller pystray Pillow
          pyinstaller packaging/windows/ghlink.spec --distpath dist/windows --workpath build/windows
      - name: ghlink --version
        shell: pwsh
        run: |
          .\dist\windows\ghlink.exe --version
          Write-Host "version exit: $LASTEXITCODE"
      - name: ghlink enable (抓真实报错 + 首轮心跳验证)
        shell: pwsh
        run: |
          Write-Host "=== whoami ==="; whoami
          Write-Host "=== enable ==="
          .\dist\windows\ghlink.exe enable
          Write-Host "enable exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "=== schtasks /Query（注册验证）==="
          schtasks /Query /TN ghlink
          Write-Host "schtasks query exit: $LASTEXITCODE"
          # 等待首轮完成（探测 8 域名×timeout15s 串行最坏 120s，宽限到 100s）
          Write-Host "=== 等待首轮执行完成（100s）==="
          Start-Sleep -Seconds 100
          Write-Host "=== ghlink status（首轮后心跳应正常）==="
          .\dist\windows\ghlink.exe status
          Write-Host "status exit: $LASTEXITCODE"
          Write-Host "=== hosts 段落检查 ==="
          Select-String -Path C:\Windows\System32\drivers\etc\hosts -Pattern "ghlink Start","ghlink520 Start" | ForEach-Object { $_.Line }
      - name: cleanup disable
        shell: pwsh
        run: |
          .\dist\windows\ghlink.exe disable
          $disableExit = $LASTEXITCODE
          Write-Host "disable exit: $disableExit"
          schtasks /Query /TN ghlink *> $null
          $queryExit = $LASTEXITCODE
          Write-Host "schtasks query after disable exit: $queryExit（1=任务已删除，符合预期）"
          if ($disableExit -ne 0) { exit $disableExit }
          if ($queryExit -eq 0) { Write-Host "FAIL: 任务仍存在"; exit 1 }
          Write-Host "PASS: 任务已移除"; exit 0
